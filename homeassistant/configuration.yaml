# Home Assistant configuration for this project. This is meant to be
# copied into (or merged with) the config directory HA actually runs from
# (./homeassistant when using the docker-compose.yml in this repo, or
# /config on Home Assistant OS). Don't overwrite an existing
# configuration.yaml wholesale if you already have other integrations set
# up — merge these keys in.

default_config:

# Required when HA sits behind a reverse proxy / tunnel (e.g. the
# cloudflared container in docker-compose.yml) so it trusts the
# forwarded headers instead of rejecting the connection.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Light groups (Living Room banks, Hallway, Bedroom) — see lights.yaml.
light: !include lights.yaml

# Presets built on the groups above — see scenes.yaml.
scene: !include scenes.yaml

# Exposes the presets to Google Home. Requires a Google Cloud project +
# OAuth client + service account set up per the README's "Google
# Assistant (self-hosted)" section. Put the real values in secrets.yaml
# (never commit that file) and drop the downloaded service account key at
# homeassistant/google_service_account.json (also gitignored).
google_assistant:
  project_id: !secret google_assistant_project_id
  service_account: !include google_service_account.json
  report_state: true
  exposed_domains:
    - scene
  entity_config:
    scene.preset_movie_night:
      name: Movie Night
      expose: true
    scene.preset_relax:
      name: Relax
      expose: true
    scene.preset_bright_daytime:
      name: Bright Daytime
      expose: true
    scene.preset_reading:
      name: Reading
      expose: true
    scene.preset_party:
      name: Party
      expose: true
    scene.preset_goodnight:
      name: Goodnight
      expose: true
