# Whole-house light presets, built on top of the groups in lights.yaml.
# Each becomes a `scene.<name>` entity you can expose to Google Home.
#
# Caveats to check against your actual hardware:
#   - Govee (Living Room): most Govee smart lights support full RGB, so
#     these use `rgb_color`. If any of your Bookshelf/TV/Sofa/Rincon
#     lights are brightness-only, drop the color key for those entities.
#   - Hue (Hallway, Bedroom): these presets assume White Ambiance bulbs
#     and only set `color_temp_kelvin`. If Trevor/Vivi/Sofa Lamp or the
#     Hallway lights are Hue Color bulbs, feel free to add `rgb_color`
#     instead for punchier presets.

- id: preset_movie_night
  name: Movie Night
  entities:
    light.living_room_tv:
      state: "on"
      brightness: 60
      rgb_color: [30, 30, 70]      # dim blue bias light behind the TV
    light.living_room_bookshelf:
      state: "on"
      brightness: 35
      rgb_color: [255, 147, 41]    # warm amber
    light.living_room_sofa:
      state: "off"
    light.living_room_rincon:
      state: "off"
    light.hallway_all:
      state: "on"
      brightness: 15
      color_temp_kelvin: 2700
    light.bedroom_all:
      state: "off"

