# Self-hosting route for Home Assistant on a machine you already own
# (spare PC, mini PC, NAS, etc). If you're instead flashing a dedicated
# Raspberry Pi with Home Assistant OS, you don't need this file — see the
# README's "Option A: Raspberry Pi + HAOS" section.
#
# Usage (from this docker/ directory):
#   cp .env.example .env      # then fill in CLOUDFLARE_TUNNEL_TOKEN
#   docker compose up -d

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ../homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # Host networking is required for local device discovery (Hue bridge
    # SSDP, mDNS, etc.) — bridged networking will break auto-discovery.
    network_mode: host

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # Also uses host networking so it can reach Home Assistant at
    # localhost:8123 without extra Docker network config.
    network_mode: host
    depends_on:
      - homeassistant
