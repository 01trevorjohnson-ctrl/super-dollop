# Light presets for Home Assistant, exposed to Google Home as scenes.
#
# Edit the `entity_id` lists below to match your actual light entities
# (find them in Settings > Devices & Services > Entities, filtered to "light.").
#
# Each scene becomes a `scene.<name>` entity. Once exposed to the Google
# Assistant integration (see configuration.yaml and README.md in this repo),
# you can say "Hey Google, activate <friendly name>" or trigger it from a
# Google Home routine/automation.

- id: preset_movie_night
  name: Movie Night
  entities:
    light.living_room_main:
      state: "on"
      brightness: 40
      rgb_color: [255, 147, 41]   # warm amber
    light.living_room_lamp:
      state: "on"
      brightness: 25
      rgb_color: [255, 147, 41]
    light.living_room_accent:
      state: "off"

- id: preset_relax
  name: Relax
  entities:
    light.living_room_main:
      state: "on"
      brightness: 90
      rgb_color: [255, 174, 66]
    light.living_room_lamp:
      state: "on"
      brightness: 70
      rgb_color: [255, 174, 66]

- id: preset_bright_daytime
  name: Bright Daytime
  entities:
    light.living_room_main:
      state: "on"
      brightness: 255
      color_temp_kelvin: 5000
    light.living_room_lamp:
      state: "on"
      brightness: 255
      color_temp_kelvin: 5000
    light.living_room_accent:
      state: "on"
      brightness: 255
      color_temp_kelvin: 5000

- id: preset_reading
  name: Reading
  entities:
    light.living_room_lamp:
      state: "on"
      brightness: 200
      color_temp_kelvin: 4000
    light.living_room_main:
      state: "off"

- id: preset_party
  name: Party
  entities:
    light.living_room_main:
      state: "on"
      brightness: 255
      rgb_color: [162, 0, 255]
    light.living_room_accent:
      state: "on"
      brightness: 255
      rgb_color: [0, 200, 255]

- id: preset_goodnight
  name: Goodnight
  entities:
    light.living_room_main:
      state: "off"
    light.living_room_lamp:
      state: "off"
    light.living_room_accent:
      state: "off"
