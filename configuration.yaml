# Minimal Home Assistant configuration needed to wire the light presets in
# scenes.yaml up to Google Home. Merge these keys into your real
# configuration.yaml — don't just drop this whole file in place if you
# already have other integrations configured.

# Pulls in the presets defined in scenes.yaml.
scene: !include scenes.yaml

# Exposes entities to the Google Assistant / Google Home app so presets show
# up as scenes you can run by voice or from a Google Home routine.
#
# Prereqs (done once, outside this repo):
#   1. In the Home Assistant UI: Settings > Devices & Services > Integrations
#      > Add Integration > "Google Assistant". Follow the setup flow, which
#      links to a Google Actions/Home project and gives you the
#      `project_id` and `service_account` key referenced below.
#   2. Alternatively, if you use Home Assistant Cloud (Nabu Casa), skip the
#      manual `google_assistant:` block entirely and just toggle "Google
#      Assistant" on in Settings > Home Assistant Cloud > Google Assistant,
#      then pick which entities to expose there.
google_assistant:
  project_id: !secret google_assistant_project_id
  service_account: !include SERVICE_ACCOUNT.JSON
  report_state: true
  exposed_domains:
    - scene
  entity_config:
    scene.preset_movie_night:
      name: Movie Night
      expose: true
    scene.preset_relax:
      name: Relax
      expose: true
    scene.preset_bright_daytime:
      name: Bright Daytime
      expose: true
    scene.preset_reading:
      name: Reading
      expose: true
    scene.preset_party:
      name: Party
      expose: true
    scene.preset_goodnight:
      name: Goodnight
      expose: true
